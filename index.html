<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3a7d44" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="뽀뀨 일기" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <title>💛 뽀뀨 일기</title>

  <style>
    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --green-dark:  #2e6b3a;
      --green-main:  #3a7d44;
      --green-light: #e8f5e9;
      --text-dark:   #1a1a1a;
      --text-mid:    #555555;
      --text-light:  #9e9e9e;
      --border:      #ebebeb;
      --bg:          #f7f7f7;
      --white:       #ffffff;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text-dark);
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', 'Segoe UI', sans-serif; }

    .app-wrap { max-width: 500px; margin: 0 auto; background: var(--bg); min-height: 100vh; }

    /* ── 헤더 ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--white); border-bottom: 1px solid var(--border);
      padding: 14px 18px 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-logo { display: flex; align-items: center; gap: 8px; }
    .header-emoji { font-size: 26px; line-height: 1; }
    .header-title { font-size: 21px; font-weight: 800; color: var(--green-dark); letter-spacing: -0.5px; }
    .header-subtitle { font-size: 11px; color: var(--text-light); font-weight: 400; margin-top: 1px; }
    .header-refresh {
      background: none; border: none; font-size: 20px; cursor: pointer;
      padding: 6px; border-radius: 50%; color: var(--text-mid); transition: transform 0.4s;
    }
    .header-refresh.spinning { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 피드 ── */
    #feed { padding-bottom: 96px; }
    #feed.gallery-mode { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; padding-bottom: 96px; }
    #feed.gallery-mode .post-card { margin: 0; border: none; cursor: pointer; }
    #feed.gallery-mode .post-date, #feed.gallery-mode .post-body { display: none; }
    #feed.gallery-mode > .state-box, #feed.gallery-mode > #feed-sentinel { grid-column: 1 / -1; }

    /* ── 게시물 카드 ── */
    .post-card {
      background: var(--white); margin-bottom: 10px; overflow: hidden;
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      animation: fadeIn 0.35s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .post-date { padding: 11px 16px 10px; font-size: 12px; color: var(--text-light); display: flex; align-items: center; gap: 5px; }
    .post-date::before { content: '🕐'; font-size: 12px; }
    .post-img-wrap { width: 100%; aspect-ratio: 1/1; background: var(--green-light); position: relative; overflow: hidden; }
    .post-img-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 56px; opacity: 0.35; }
    .post-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.4s ease; }
    .post-img.loaded { opacity: 1; }
    .post-body { padding: 13px 16px 16px; }
    .post-comment-text { font-size: 14px; line-height: 1.6; color: var(--text-dark); }
    .post-no-comment { font-size: 13px; color: var(--text-light); font-style: italic; }

    /* ── 상태 박스 ── */
    .state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 24px; gap: 14px; text-align: center; }
    .state-emoji { font-size: 56px; animation: wobble 2s ease-in-out infinite; }
    .gecko-img { image-rendering: auto; }
    .gecko-img.wobble { animation: wobble 2s ease-in-out infinite; }
    @keyframes wobble { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    .state-title { font-size: 16px; font-weight: 600; color: var(--text-mid); }
    .state-sub { font-size: 13px; color: var(--text-light); }
    .retry-btn { margin-top: 8px; padding: 10px 24px; background: var(--green-main); color: var(--white); border: none; border-radius: 24px; font-size: 14px; font-weight: 600; cursor: pointer; }

    /* ── FAB 버튼 ── */
    #fab {
      position: fixed; bottom: 28px; right: 20px;
      width: 60px; height: 60px; border-radius: 50%;
      background: linear-gradient(145deg, #4caf50, #2e6b3a);
      color: var(--white); border: none; font-size: 24px; cursor: pointer;
      box-shadow: 0 4px 18px rgba(58,125,68,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 150; transition: transform 0.18s, box-shadow 0.18s;
    }
    @media (min-width: 500px) { #fab { right: calc(50% - 230px); } }
    #fab:active { transform: scale(0.9); box-shadow: 0 2px 10px rgba(58,125,68,0.4); }

    /* ── 랜덤 모달 ── */
    #modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.88); z-index: 300;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; backdrop-filter: blur(4px); overflow-y: auto;
    }
    #modal.open { display: flex; animation: modalIn 0.25s ease; }
    @keyframes modalIn { from { opacity:0; transform:scale(0.96); } to { opacity:1; transform:none; } }
    .modal-close {
      position: fixed; top: 18px; right: 18px;
      background: rgba(255,255,255,0.15); border: none; color: white;
      width: 40px; height: 40px; border-radius: 50%; font-size: 18px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10;
    }
    .modal-label { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.5); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; }
    .modal-img-wrap { width: 100%; max-width: 420px; aspect-ratio: 1/1; border-radius: 14px; overflow: hidden; background: #222; position: relative; flex-shrink: 0; }
    .modal-img-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 64px; opacity: 0.3; }
    #modal-img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; opacity: 0; transition: opacity 0.4s; }
    #modal-img.loaded { opacity: 1; }

    /* 모달 정보 영역 */
    .modal-info { margin-top: 16px; text-align: center; width: 100%; max-width: 420px; }
    .modal-date { font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 8px; }

    /* 시트 코멘트 */
    .modal-sheet-comment {
      font-size: 15px; line-height: 1.55; color: rgba(255,255,255,0.88);
      min-height: 22px; margin-bottom: 14px;
    }

    /* 응원 메시지 구분선 */
    .modal-divider {
      width: 40px; height: 1px; background: rgba(255,255,255,0.2);
      margin: 0 auto 14px;
    }

    /* 응원 메시지 */
    .modal-cheer {
      font-size: 14px; line-height: 1.7;
      color: rgba(255,255,255,0.72);
      background: rgba(255,255,255,0.08);
      border-radius: 12px; padding: 12px 16px;
      border-left: 3px solid rgba(76,175,80,0.6);
      text-align: left;
    }

    .modal-shuffle {
      margin-top: 20px; padding: 12px 28px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      color: white; border-radius: 28px; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: background 0.2s;
      flex-shrink: 0;
    }
    .modal-shuffle:active { background: rgba(255,255,255,0.22); }

    /* ── 업로드 버튼 (헤더) ── */
    .header-upload {
      background: none; border: none; font-size: 22px; cursor: pointer;
      padding: 6px 8px; border-radius: 50%; color: var(--green-dark);
      transition: background 0.15s;
    }
    .header-upload:active { background: var(--green-light); }
    .header-actions { display: flex; align-items: center; gap: 4px; }

    /* ── 업로드 모달 ── */
    #upload-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); z-index: 400;
      align-items: flex-end; justify-content: center;
      backdrop-filter: blur(3px);
    }
    #upload-modal.open { display: flex; animation: slideUp 0.28s ease; }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: none; opacity: 1; } }

    .upload-sheet {
      width: 100%; max-width: 500px;
      background: var(--white); border-radius: 22px 22px 0 0;
      padding: 0 0 env(safe-area-inset-bottom, 12px);
      max-height: 92vh; overflow-y: auto;
    }
    .upload-handle {
      width: 40px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 12px auto 0;
    }
    .upload-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px 10px;
      border-bottom: 1px solid var(--border);
    }
    .upload-title { font-size: 16px; font-weight: 700; color: var(--text-dark); }
    .upload-close-btn {
      background: none; border: none; font-size: 20px; cursor: pointer;
      color: var(--text-mid); padding: 4px 8px;
    }

    /* 사진 선택 영역 */
    .upload-pick-area {
      margin: 14px 16px 0;
      border: 2px dashed var(--border); border-radius: 14px;
      padding: 28px 16px; text-align: center; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-pick-area:active { background: var(--green-light); border-color: var(--green-main); }
    .upload-pick-area.has-files { display: none; }
    .upload-pick-emoji { font-size: 36px; margin-bottom: 8px; }
    .upload-pick-text { font-size: 14px; color: var(--text-mid); }
    .upload-pick-sub { font-size: 12px; color: var(--text-light); margin-top: 4px; }
    #upload-file-input { display: none; }

    /* 사진 리스트 (사진별 개별 입력) */
    .photo-list { padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px; }

    .photo-list-item {
      display: flex; gap: 10px; align-items: flex-start;
      background: var(--bg); border-radius: 14px; padding: 10px;
      border: 1px solid var(--border);
    }
    .item-thumb {
      width: 80px; height: 80px; border-radius: 10px; overflow: hidden;
      flex-shrink: 0; position: relative; background: var(--green-light);
    }
    .item-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .item-remove {
      position: absolute; top: 3px; right: 3px;
      background: rgba(0,0,0,0.6); color: white; border: none;
      width: 20px; height: 20px; border-radius: 50%; font-size: 10px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .item-fields { flex: 1; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
    .item-gecko-chips { display: flex; gap: 5px; }
    .item-gecko-chip {
      flex: 1; padding: 5px 2px; border-radius: 8px; font-size: 11px; font-weight: 700;
      border: 1.5px solid var(--border); background: var(--white); color: var(--text-mid);
      cursor: pointer; transition: all 0.12s; text-align: center;
    }
    .item-gecko-chip.selected {
      border-color: var(--green-main); background: var(--green-light); color: var(--green-dark);
    }
    .item-comment {
      width: 100%; border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 10px; font-size: 13px; line-height: 1.45; resize: none;
      font-family: inherit; color: var(--text-dark); background: var(--white); outline: none;
    }
    .item-comment:focus { border-color: var(--green-main); }

    /* 사진 더 추가 버튼 */
    .photo-add-more {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin: 0 16px; padding: 11px; border-radius: 12px;
      border: 1.5px dashed var(--border); background: none; cursor: pointer;
      font-size: 13px; color: var(--text-mid); transition: background 0.15s;
      width: calc(100% - 32px);
    }
    .photo-add-more:active { background: var(--green-light); }

    /* 업로드 버튼 */
    .upload-submit {
      margin: 16px 16px 12px; width: calc(100% - 32px);
      padding: 14px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, #4caf50, #2e6b3a);
      color: white; font-size: 15px; font-weight: 700; cursor: pointer;
      transition: opacity 0.15s;
    }
    .upload-submit:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── 피드 카드: 게코 배지 + 인라인 피커 ── */
    .post-gecko-row { margin-bottom: 8px; }
    .post-gecko-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 11px; border-radius: 20px; font-size: 12px; font-weight: 700;
      border: 1.5px solid var(--border); background: var(--bg); color: var(--text-mid);
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
      line-height: 1.4;
    }
    .post-gecko-badge[data-gecko="뽀또"] { background: #fffde7; border-color: #f9c74f; color: #7a5500; }
    .post-gecko-badge[data-gecko="뀨"]   { background: var(--green-light); border-color: var(--green-main); color: var(--green-dark); }
    .post-gecko-badge[data-gecko="둘 다"] { background: #f0fff0; border-color: #aaa; color: #444; }
    .post-gecko-badge::after { content: ' ✎'; font-size: 10px; opacity: 0.5; }

    .gecko-picker {
      display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap;
    }
    .gecko-pick-opt {
      padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
      border: 1.5px solid var(--border); background: var(--white); color: var(--text-mid);
      cursor: pointer; transition: all 0.12s;
    }
    .gecko-pick-opt[data-gecko="뽀또"] { border-color: #f9c74f; }
    .gecko-pick-opt[data-gecko="뽀또"]:active,
    .gecko-pick-opt[data-gecko="뽀또"].active { background: #fffde7; color: #7a5500; }
    .gecko-pick-opt[data-gecko="뀨"] { border-color: var(--green-main); }
    .gecko-pick-opt[data-gecko="뀨"]:active,
    .gecko-pick-opt[data-gecko="뀨"].active { background: var(--green-light); color: var(--green-dark); }
    .gecko-pick-opt[data-gecko="둘 다"] { border-color: #aaa; }
    .gecko-pick-opt[data-gecko="둘 다"]:active,
    .gecko-pick-opt[data-gecko="둘 다"].active { background: #f0fff0; color: #333; }

    /* 업로드 진행 */
    .upload-progress {
      padding: 12px 16px; display: none;
      align-items: center; gap: 10px;
    }
    .upload-progress.show { display: flex; }
    .progress-bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--green-main); border-radius: 3px; transition: width 0.3s; width: 0%; }
    .progress-label { font-size: 12px; color: var(--text-mid); white-space: nowrap; }
  </style>
</head>
<body>
<div class="app-wrap">

  <header class="header">
    <div class="header-logo">
      <img class="gecko-img" src="bbo.png" alt="뽀또" style="width:34px;height:34px;object-fit:contain;" />
      <div>
        <div class="header-title" id="title-trigger" style="user-select:none;">뽀뀨 일기</div>
        <div class="header-subtitle">뽀또 &amp; 뀨의 하루하루 🌿</div>
      </div>
      <img class="gecko-img" src="kkyu.png" alt="뀨" style="width:34px;height:34px;object-fit:contain;" />
    </div>
    <div class="header-actions">
      <button class="header-refresh" id="gallery-btn" title="모아보기">⊞</button>
      <button class="header-refresh" id="refresh-btn" title="새로고침">↻</button>
    </div>
  </header>

  <main id="feed">
    <div class="state-box" id="loading-state">
      <img class="gecko-img wobble" src="bbo.png" alt="뽀뀨" style="width:72px;height:72px;object-fit:contain;" />
      <p class="state-title">뽀뀨 사진 불러오는 중...</p>
      <p class="state-sub">잠깐만 기다려줘요 💚</p>
    </div>
  </main>

</div>

<!-- 업로드 모달 -->
<div id="upload-modal" role="dialog" aria-label="사진 올리기">
  <div class="upload-sheet">
    <div class="upload-handle"></div>
    <div class="upload-header">
      <span class="upload-title">📷 사진 올리기</span>
      <button class="upload-close-btn" id="upload-close">✕</button>
    </div>

    <input type="file" id="upload-file-input" accept="image/*" multiple />

    <!-- 사진 없을 때: 선택 유도 -->
    <div class="upload-pick-area" id="upload-pick-area">
      <img class="gecko-img" src="bbo.png" alt="뽀뀨" style="width:56px;height:56px;object-fit:contain;margin-bottom:8px;" />
      <div class="upload-pick-text">사진을 선택해 주세요</div>
      <div class="upload-pick-sub">여러 장 한 번에 선택 가능</div>
    </div>

    <!-- 사진 리스트 (사진 있을 때) -->
    <div class="photo-list" id="photo-list" style="display:none"></div>
    <button class="photo-add-more" id="photo-add-more" style="display:none">＋ 사진 더 추가</button>

    <!-- 업로드 진행 -->
    <div class="upload-progress" id="upload-progress">
      <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>
      <span class="progress-label" id="progress-label">0 / 0</span>
    </div>

    <button class="upload-submit" id="upload-submit" disabled>업로드</button>
  </div>
</div>

<!-- FAB -->
<button id="fab" aria-label="랜덤 사진 보기">🎲</button>

<!-- 랜덤 모달 -->
<div id="modal" role="dialog" aria-label="랜덤 뽀뀨 사진">
  <button class="modal-close" id="modal-close" aria-label="닫기">✕</button>
  <p class="modal-label">✨ 오늘의 랜덤 뽀뀨</p>
  <div class="modal-img-wrap">
    <div class="modal-img-placeholder"><img class="gecko-img" src="bbo.png" alt="뽀뀨" style="width:80px;height:80px;object-fit:contain;opacity:0.4;" /></div>
    <img id="modal-img" src="" alt="랜덤 뽀뀨 사진" />
  </div>
  <div class="modal-info">
    <p class="modal-date" id="modal-date"></p>
    <p class="modal-sheet-comment" id="modal-sheet-comment"></p>
    <div class="modal-divider"></div>
    <p class="modal-cheer" id="modal-cheer"></p>
  </div>
  <button class="modal-shuffle" id="modal-shuffle">🔀 다른 사진 보기</button>
</div>

// ── geckoName에 맞는 배열에서 랜덤 응원 메시지 선택 ──
function getCheer(geckoName) {
  let pool;
  const name = String(geckoName || "").trim();
  if (name === "뽀또") {
    pool = cheersPpotto;
  } else if (name === "뀨") {
    pool = cheersGyu;
  } else {
    pool = cheersBoth; // "둘 다" 또는 빈 값(구형 데이터)
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

const PAGE_SIZE = 10;
let allPosts = [];
let feedOffset = 0;
let feedTotal = 0;
let feedLoading = false;
let feedObserver = null;

async function loadPosts() {
  const feed = document.getElementById('feed');
  const refreshBtn = document.getElementById('refresh-btn');
  refreshBtn.classList.add('spinning');
  allPosts = [];
  feedOffset = 0;
  feedTotal = 0;
  feed.innerHTML = '';
  disconnectObserver();
  try {
    await fetchPage(0, feed, true);
  } catch (err) {
    console.error('[뽀뀨]', err);
    feed.innerHTML = `
      <div class="state-box">
        <span class="state-emoji">😢</span>
        <p class="state-title">사진을 불러오지 못했어요</p>
        <p class="state-sub">${sanitize(err.message)}</p>
        <button class="retry-btn" onclick="loadPosts()">다시 시도</button>
      </div>`;
  } finally {
    refreshBtn.classList.remove('spinning');
  }
}

async function fetchPage(offset, feed, isFirst) {
  if (feedLoading) return;
  feedLoading = true;
  try {
    const res = await fetch(`${GAS_URL}?limit=${PAGE_SIZE}&offset=${offset}&t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('서버 오류: ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    // 구버전 GAS가 배열 직접 반환할 경우 대응
    const posts = Array.isArray(data) ? data : (data.posts || []);
    feedTotal = Array.isArray(data) ? data.length : (data.total || 0);
    feedOffset = offset + posts.length;
    allPosts = allPosts.concat(posts);

    if (isFirst && allPosts.length === 0) {
      feed.innerHTML = `
        <div class="state-box">
          <span class="state-emoji">🥚</span>
          <p class="state-title">아직 등록된 사진이 없어요</p>
          <p class="state-sub">첫 사진을 올려주세요!</p>
        </div>`;
      return;
    }

    posts.forEach((post) => appendCard(feed, post));

    if (feedOffset < feedTotal) {
      setupObserver(feed);
    }
  } finally {
    feedLoading = false;
  }
}

function geckoLabel(name) {
  if (name === '뽀또') return '💛 뽀또';
  if (name === '뀨')   return '💚 뀨';
  if (name === '둘 다') return '💛💚 둘 다';
  return '· 미설정';
}

function appendCard(feed, post) {
  const card = document.createElement('article');
  card.className = 'post-card';
  card.dataset.photoUrl = post.photoUrl || '';
  const imgHtml = post.photoUrl
    ? `<img class="post-img" src="${sanitize(post.photoUrl.replace(/sz=w\d+/, 'sz=w640'))}" alt="뽀뀨 사진"
           loading="lazy" decoding="async" onerror="this.remove()" onload="this.classList.add('loaded')" />`
    : '';
  const commentHtml = post.comment
    ? `<span class="post-comment-text">${sanitize(post.comment)}</span>`
    : `<span class="post-no-comment">오늘은 말없이 귀여움만 <img src="bbo.png" alt="🦎" style="width:16px;height:16px;object-fit:contain;vertical-align:middle;" /></span>`;
  const geckoName = post.geckoName || '';
  card.innerHTML = `
    <div class="post-date">${sanitize(post.timestamp)}</div>
    <div class="post-img-wrap">
      <div class="post-img-placeholder"><img src="bbo.png" alt="🦎" style="width:64px;height:64px;object-fit:contain;opacity:0.3;" /></div>
      ${imgHtml}
    </div>
    <div class="post-body">
      <div class="post-gecko-row">
        <button class="post-gecko-badge" data-gecko="${sanitize(geckoName)}">${geckoLabel(geckoName)}</button>
      </div>
      ${commentHtml}
    </div>`;
  feed.appendChild(card);
}

function setupObserver(feed) {
  disconnectObserver();
  const sentinel = document.createElement('div');
  sentinel.id = 'feed-sentinel';
  feed.appendChild(sentinel);
  feedObserver = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) {
      fetchPage(feedOffset, feed, false);
    }
  }, { rootMargin: '200px' });
  feedObserver.observe(sentinel);
}

function disconnectObserver() {
  if (feedObserver) { feedObserver.disconnect(); feedObserver = null; }
  const old = document.getElementById('feed-sentinel');
  if (old) old.remove();
}

function renderFeed() { loadPosts(); }

// ── 모달: 시트 코멘트 + 랜덤 응원 메시지 함께 표시 ──

  const modalImg = document.getElementById('modal-img');
  modalImg.classList.remove('loaded');
  modalImg.src = '';
  document.getElementById('modal-date').textContent = post.timestamp || '';
  document.getElementById('modal-sheet-comment').textContent = post.comment || '📸 오늘의 뽀뀨';
  document.getElementById('modal-cheer').textContent = getCheer(post.geckoName);

    modalImg.src = post.photoUrl;
    modalImg.onload = () => modalImg.classList.add('loaded');
  }
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openRandom() {
  if (allPosts.length === 0) return;
  showPostInModal(allPosts[Math.floor(Math.random() * allPosts.length)]);
}

  document.getElementById('modal').classList.remove('open');

}

});

function sanitize(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function addFiles(files) {
  files.forEach(f => {
    if (!f.type.startsWith('image/')) return;
    uploadFiles.push({ file: f, objectUrl: URL.createObjectURL(f), geckoName: '뽀또', comment: '' });
  });
  renderPhotoList();
  updateSubmitBtn();
}

function removeFile(idx) {
  URL.revokeObjectURL(uploadFiles[idx].objectUrl);
  uploadFiles.splice(idx, 1);
  renderPhotoList();
  updateSubmitBtn();
}

function renderPhotoList() {
  const list   = document.getElementById('photo-list');
  const pick   = document.getElementById('upload-pick-area');
  const addBtn = document.getElementById('photo-add-more');

  if (uploadFiles.length === 0) {
    list.style.display   = 'none';
    addBtn.style.display = 'none';
    pick.style.display   = '';
    return;
  }

  pick.style.display   = 'none';
  list.style.display   = 'flex';
  addBtn.style.display = '';

  list.innerHTML = '';
  uploadFiles.forEach((f, idx) => {
    const item = document.createElement('div');
    item.className = 'photo-list-item';
    item.innerHTML = `
      <div class="item-thumb">
        <img src="${f.objectUrl}" alt="" />
        <button class="item-remove" data-idx="${idx}">✕</button>
      </div>
      <div class="item-fields">
        <div class="item-gecko-chips">
          ${GECKO_OPTIONS.map(g => `
            <button class="item-gecko-chip${f.geckoName === g ? ' selected' : ''}"
                    data-idx="${idx}" data-gecko="${g}">${g}</button>
          `).join('')}
        </div>
        <textarea class="item-comment" data-idx="${idx}" rows="2"
          placeholder="오늘의 뽀뀨는...">${f.comment}</textarea>
      </div>`;
    list.appendChild(item);
  });

  // 이벤트
  list.querySelectorAll('.item-remove').forEach(btn => {
    btn.addEventListener('click', () => removeFile(Number(btn.dataset.idx)));
  });
  list.querySelectorAll('.item-gecko-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      uploadFiles[idx].geckoName = btn.dataset.gecko;
      btn.closest('.item-gecko-chips').querySelectorAll('.item-gecko-chip').forEach(b => {
        b.classList.toggle('selected', b.dataset.gecko === btn.dataset.gecko);

function updateSubmitBtn() {
  document.getElementById('upload-submit').disabled = uploadFiles.length === 0;

function setProgress(show, current, total) {
  const el = document.getElementById('upload-progress');
  el.classList.toggle('show', !!show);
  if (show) {
    document.getElementById('progress-bar').style.width = (current / total * 100) + '%';
    document.getElementById('progress-label').textContent = current + ' / ' + total;
  }
}

// ── no-cors fetch → GAS POST (form-urlencoded, CORS 우회) ──
async function submitViaForm(data) {
  const body = 'data=' + encodeURIComponent(JSON.stringify(data));
  await fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body
  });
  // no-cors라 응답 못 읽지만 GAS e.parameter.data 정상 수신
}

// ── 이미지 압축 (canvas, max 800px, JPEG 0.6) ──
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(img.src); reject(new Error('이미지 로드 실패: ' + file.name)); };
    img.onload = () => {
      URL.revokeObjectURL(img.src);
      const MAX = 800;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else       { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => {
        const reader = new FileReader();
        reader.onload = () => {
          console.log('[뽀뀨] 압축 완료, base64 size:', reader.result.length);
          resolve({ image: reader.result.split(',')[1], mimeType: 'image/jpeg', fileName: file.name.replace(/\.[^.]+$/, '.jpg') });
        };
        reader.readAsDataURL(blob);
      }, 'image/jpeg', 0.6);
    };
    img.src = URL.createObjectURL(file);
  });
}

// ── 업로드 실행 ──
document.getElementById('upload-submit').addEventListener('click', async () => {
  if (uploadFiles.length === 0) return;
  const btn = document.getElementById('upload-submit');
  btn.disabled = true;
  btn.textContent = '압축 중...';
  setProgress(true, 0, uploadFiles.length);

  try {
    const photos = [];
    for (let i = 0; i < uploadFiles.length; i++) {
      const compressed = await compressImage(uploadFiles[i].file);
      compressed.comment   = uploadFiles[i].comment.trim();
      compressed.geckoName = uploadFiles[i].geckoName;
      photos.push(compressed);
      setProgress(true, i + 1, uploadFiles.length);
    }

    btn.textContent = '전송 중...';
    await submitViaForm({ photos });

    btn.textContent = '완료! 💛💚';
    setTimeout(() => { closeUploadModal(); loadPosts(); }, 3000);

  } catch (err) {
    alert('업로드 실패: ' + err.message);
    btn.disabled = false;
    btn.textContent = '업로드';
    setProgress(false);
  }
});

async function selectGeckoOption(opt) {
  const picker   = opt.closest('.gecko-picker');
  const row      = picker.parentElement;             // .post-gecko-row
  const badge    = row.querySelector('.post-gecko-badge');
  const card     = opt.closest('.post-card');
  const newGecko = opt.dataset.gecko;
  const photoUrl = card ? card.dataset.photoUrl : '';

  // 배지 즉시 갱신
  badge.dataset.gecko = newGecko;
  badge.textContent   = geckoLabel(newGecko);
  badge.insertAdjacentText('beforeend', ''); // force repaint
  picker.remove();

  // allPosts 로컬 상태 동기화
  const post = allPosts.find(p => p.photoUrl === photoUrl);
  if (post) post.geckoName = newGecko;

  // GAS 업데이트 (no-cors, fire-and-forget)
  if (photoUrl) {
    fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'data=' + encodeURIComponent(JSON.stringify({
        action: 'updateGecko',
        photoUrl: photoUrl,
        geckoName: newGecko
      }))
    }).catch(err => console.warn('[뽀뀨] gecko update failed', err));
  }
}

// 피드 이벤트 델리게이션 (카드가 동적으로 생성되므로)
document.getElementById('feed').addEventListener('click', (e) => {
  const badge = e.target.closest('.post-gecko-badge');
  if (badge) { openGeckoPicker(badge); return; }

  const opt = e.target.closest('.gecko-pick-opt');
  if (opt) { selectGeckoOption(opt); return; }

  // 피커 바깥 클릭 시 닫기
  if (!e.target.closest('.gecko-picker')) closeAllPickers();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

loadPosts();

// #upload 해시로 접속 시 업로드 모달 자동 오픈
if (location.hash === '#upload') {
  window.addEventListener('load', () => {
    setTimeout(openUploadModal, 300);
  });
}
</script>
</body>
</html>
