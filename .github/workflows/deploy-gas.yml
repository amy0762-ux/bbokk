name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'gas-code.js'
      - 'appsscript.json'
      - '.github/workflows/deploy-gas.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp credentials
        run: echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

      - name: Push to GAS
        run: clasp push --force

      # 웹앱 배포(@26)를 새 버전으로 갱신 → /exec URL이 바로 새 코드 서빙
      - name: Redeploy web app
        run: clasp deploy -i AKfycbxh9ZoxMXRHUw8Phzz9OHiaTZJ4R0Onen8KE-DAyoGUNkzpntgXhXlkuzHlBOktRtatqg -d "auto: ${{ github.event.head_commit.message }}"
